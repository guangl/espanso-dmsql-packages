matches:
  # --- Common SQL syntax ---
  - trigger: ":dmsel"
    replace: "SELECT $|$ FROM $|$ WHERE $|$;"

  - trigger: ":dmins"
    replace: "INSERT INTO $|$ ($|$) VALUES ($|$);"

  - trigger: ":dmupd"
    replace: "UPDATE $|$ SET $|$ WHERE $|$;"

  - trigger: ":dmdel"
    replace: "DELETE FROM $|$ WHERE $|$;"

  - trigger: ":dmjoin"
    replace: "SELECT $|$ FROM $|$ a JOIN $|$ b ON a.$|$ = b.$|$;"

  - trigger: ":dmctab"
    replace: |-
      CREATE TABLE "$|$" (
          "ID" BIGINT IDENTITY(1, 1) NOT NULL,
          "$|$" VARCHAR(100),
          PRIMARY KEY("ID")
      ) STORAGE(ON "MAIN", CLUSTERBTR);

  - trigger: ":dmidx"
    replace: "CREATE INDEX \"$|$\" ON \"$|$\"(\"$|$\");"

  - trigger: ":dmlimit"
    replace: "SELECT $|$ FROM $|$ WHERE $|$ LIMIT $|$;"

  - trigger: ":dmpage"
    replace: "SELECT $|$ FROM $|$ ORDER BY $|$ LIMIT $|$ OFFSET $|$;"

  # --- DM-specific functions / system views ---
  - trigger: ":dmver"
    replace: "SELECT * FROM V$VERSION;"

  - trigger: ":dminst"
    replace: "SELECT * FROM V$INSTANCE;"

  - trigger: ":dmsess"
    replace: "SELECT * FROM V$SESSIONS;"

  - trigger: ":dmlock"
    replace: "SELECT * FROM V$LOCK;"

  - trigger: ":dmsql"
    replace: "SELECT * FROM V$SQL WHERE SQL_TEXT LIKE '%$|$%';"

  - trigger: ":dmsysparam"
    replace: "SELECT * FROM V$DM_INI WHERE PARA_NAME = '$|$';"

  - trigger: ":dmsysdate"
    replace: "SELECT SYSDATE FROM DUAL;"

  - trigger: ":dmrowid"
    replace: "SELECT ROWID, $|$ FROM $|$;"

  - trigger: ":dmexplain"
    replace: "EXPLAIN $|$;"

  # --- DBA / admin commands ---
  - trigger: ":dmcreateuser"
    replace: "CREATE USER \"$|$\" IDENTIFIED BY \"$|$\";"

  - trigger: ":dmgrant"
    replace: "GRANT $|$ TO \"$|$\";"

  - trigger: ":dmrevoke"
    replace: "REVOKE $|$ FROM \"$|$\";"

  - trigger: ":dmtbs"
    replace: "CREATE TABLESPACE \"$|$\" DATAFILE '$|$.DBF' SIZE $|$;"

  - trigger: ":dmbackup"
    replace: "BACKUP DATABASE FULL TO \"$|$\" BACKUPSET '$|$';"

  - trigger: ":dmrestore"
    replace: "RESTORE DATABASE FROM BACKUPSET '$|$';"

  - trigger: ":dmkilsess"
    replace: "SP_CLOSE_SESSION($|$);"

  - trigger: ":dmtabsize"
    replace: "SELECT TABLE_NAME, BYTES/1024/1024 AS SIZE_MB FROM USER_SEGMENTS WHERE SEGMENT_TYPE = 'TABLE' ORDER BY BYTES DESC;"
